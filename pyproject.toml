[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-librarian-sdk"
version = "0.1.0"
description = "Librarian: graded lesson ledger on the custody chain, tiered semantic memory with a card registry, and a decision-trace graph."
requires-python = ">=3.10"
dependencies = ["vega-custody-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
